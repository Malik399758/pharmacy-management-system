<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Payment | Pharmacy Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="payment-page">

        <div class="payment-card">

            <div class="payment-header">

                <div class="payment-icon">
                    💳
                </div>

                <h1>
                    Secure Payment
                </h1>

                <p>
                    Test Payment Mode
                </p>

            </div>


            <div class="test-mode">

                🔒 This is a demo payment.
                No real money will be charged.

            </div>


            <div class="payment-summary">

                <span>
                    Order Total
                </span>

                <strong id="payment-total">
                    Rs. 0
                </strong>

            </div>


            <form id="payment-form">

                <div class="payment-field">

                    <label>
                        Card Number
                    </label>

                    <input
                        type="text"
                        id="card-number"
                        placeholder="4242 4242 4242 4242"
                        maxlength="19"
                        required
                    >

                </div>


                <div class="payment-row">

                    <div class="payment-field">

                        <label>
                            Expiry Date
                        </label>

                        <input
                            type="text"
                            id="expiry"
                            placeholder="MM/YY"
                            maxlength="5"
                            required
                        >

                    </div>


                    <div class="payment-field">

                        <label>
                            CVV
                        </label>

                        <input
                            type="password"
                            id="cvv"
                            placeholder="123"
                            maxlength="3"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="pay-button"
                >
                    🔒 Pay Now
                </button>


                <p
                    id="payment-message"
                    class="payment-message"
                ></p>

            </form>


            <div class="payment-footer">

                🔐 Secure Demo Payment

            </div>

        </div>

    </div>


    <script src="payment.js"></script>

</body>

</html>
