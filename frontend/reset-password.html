<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Pharmacy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #ecfeff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .reset-wrapper {
            width: 100%;

            max-width: 440px;
        }


        .reset-card {
            background: #ffffff;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.12);
        }


        /* ===============================
           BRAND
        =============================== */

        .brand {
            text-align: center;

            margin-bottom: 30px;
        }


        .brand-icon {
            width: 58px;

            height: 58px;

            margin: 0 auto 16px;

            border-radius: 16px;

            background: #1e3a8a;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            font-weight: bold;
        }


        .brand h1 {
            margin: 0;

            color: #0b1f3a;

            font-size: 27px;
        }


        .brand p {
            margin-top: 10px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;
        }


        /* ===============================
           FORM
        =============================== */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        .password-wrapper {
            position: relative;
        }


        .password-wrapper input {
            width: 100%;

            padding: 14px;

            padding-right: 48px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        .password-wrapper input:focus {
            border-color: #1e3a8a;

            box-shadow:
                0 0 0 3px
                rgba(30, 58, 138, 0.10);
        }


        .toggle-password {
            position: absolute;

            right: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            color: #64748b;

            font-size: 16px;

            padding: 2px;
        }


        .toggle-password:hover {
            color: #1e3a8a;
        }


        /* ===============================
           PASSWORD REQUIREMENTS
        =============================== */

        .password-info {
            margin-top: -8px;

            margin-bottom: 20px;

            padding: 12px;

            background: #f8fafc;

            border-radius: 10px;

            color: #64748b;

            font-size: 12px;

            line-height: 1.6;
        }


        /* ===============================
           BUTTON
        =============================== */

        .reset-btn {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: #1e3a8a;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .reset-btn:hover {
            background: #172e6d;
        }


        .reset-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }


        /* ===============================
           MESSAGE
        =============================== */

        .message {
            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ===============================
           LOGIN LINK
        =============================== */

        .login-link {
            margin-top: 24px;

            text-align: center;

            color: #64748b;

            font-size: 14px;
        }


        .login-link a {
            color: #1e3a8a;

            font-weight: 600;

            text-decoration: none;
        }


        .login-link a:hover {
            text-decoration: underline;
        }


        /* ===============================
           MOBILE
        =============================== */

        @media (max-width: 480px) {

            .reset-card {
                padding: 28px 22px;
            }


            .brand h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="reset-wrapper">


        <div class="reset-card">


            <!-- ==========================
                 BRAND
            =========================== -->

            <div class="brand">

                <div class="brand-icon">
                    🔐
                </div>


                <h1>
                    Reset Password
                </h1>


                <p>
                    Create a new secure password
                    for your pharmacy account.
                </p>

            </div>


            <!-- ==========================
                 RESET FORM
            =========================== -->

            <form id="reset-password-form">


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter new password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-confirm-password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- PASSWORD INFO -->

                <div class="password-info">

                    🔒 Password must contain at least
                    <strong>6 characters</strong>.

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="reset-btn"
                    id="reset-btn"
                >
                    Reset Password
                </button>


                <!-- MESSAGE -->

                <div
                    class="message"
                    id="message"
                ></div>


            </form>


            <!-- LOGIN -->

            <div class="login-link">

                Remember your password?

                <a href="login.html">
                    Back to Login
                </a>

            </div>


        </div>


    </div>


    <script>

        // ===============================
        // ELEMENTS
        // ===============================

        const resetForm =
            document.getElementById(
                "reset-password-form"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const resetBtn =
            document.getElementById(
                "reset-btn"
            );


        const message =
            document.getElementById(
                "message"
            );


        const togglePassword =
            document.getElementById(
                "toggle-password"
            );


        const toggleConfirmPassword =
            document.getElementById(
                "toggle-confirm-password"
            );


        // ===============================
        // GET RESET TOKEN FROM URL
        // ===============================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const resetToken =
            urlParams.get("token");


        // ===============================
        // CHECK TOKEN
        // ===============================

        if (!resetToken) {

            message.textContent =
                "Invalid or missing password reset link.";

            message.style.color =
                "#dc2626";

            resetBtn.disabled = true;

        }


        // ===============================
        // SHOW / HIDE PASSWORD
        // ===============================

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "🙈";

                } else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁";

                }

            }
        );


        // ===============================
        // SHOW / HIDE CONFIRM PASSWORD
        // ===============================

        toggleConfirmPassword.addEventListener(
            "click",
            function () {

                if (
                    confirmPasswordInput.type ===
                    "password"
                ) {

                    confirmPasswordInput.type =
                        "text";

                    toggleConfirmPassword.textContent =
                        "🙈";

                } else {

                    confirmPasswordInput.type =
                        "password";

                    toggleConfirmPassword.textContent =
                        "👁";

                }

            }
        );


        // ===============================
        // RESET PASSWORD
        // ===============================

        resetForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const password =
                    passwordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                // ===============================
                // CHECK PASSWORD LENGTH
                // ===============================

                if (password.length < 6) {

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    message.style.color =
                        "#dc2626";

                    return;

                }


                // ===============================
                // CHECK PASSWORD MATCH
                // ===============================

                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "#dc2626";

                    return;

                }


                // ===============================
                // LOADING
                // ===============================

                resetBtn.disabled = true;

                resetBtn.textContent =
                    "Resetting Password...";

                message.textContent =
                    "";


                try {

                    /*
                        Backend reset-password API
                        next step mein connect hogi.
                    */

                    const response =
                        await fetch(
                            `http://localhost:5000/api/customers/reset-password/${resetToken}`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        password

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Failed to reset password."
                        );

                    }


                    // ===============================
                    // SUCCESS
                    // ===============================

                    message.textContent =
                        "Password reset successful! Redirecting to login...";

                    message.style.color =
                        "#16a34a";


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1200
                    );


                } catch (error) {

                    console.error(
                        "Reset password error:",
                        error
                    );


                    message.textContent =
                        error.message ||
                        "Failed to reset password.";

                    message.style.color =
                        "#dc2626";


                    resetBtn.disabled =
                        false;

                    resetBtn.textContent =
                        "Reset Password";

                }

            }
        );

    </script>


</body>

</html>
