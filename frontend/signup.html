<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Pharmacy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #ecfeff
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .signup-wrapper {
            width: 100%;
            max-width: 460px;
        }


        .signup-card {
            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.12);
        }


        .brand {
            text-align: center;

            margin-bottom: 28px;
        }


        .brand-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            border-radius: 16px;

            background: #1e3a8a;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;
        }


        .brand h1 {
            margin: 0;

            color: #0b1f3a;

            font-size: 28px;
        }


        .brand p {
            margin-top: 8px;

            color: #64748b;

            font-size: 14px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        .form-group input:focus {
            border-color: #1e3a8a;

            box-shadow:
                0 0 0 3px
                rgba(30, 58, 138, 0.1);
        }


        .signup-btn {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: #1e3a8a;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .signup-btn:hover {
            background: #172e6d;
        }


        .signup-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }


        .message {
            margin-top: 16px;

            text-align: center;

            font-size: 14px;

            min-height: 20px;
        }


        .login-link {
            margin-top: 22px;

            text-align: center;

            color: #64748b;

            font-size: 14px;
        }


        .login-link a {
            color: #1e3a8a;

            font-weight: 600;

            text-decoration: none;
        }


        .login-link a:hover {
            text-decoration: underline;
        }


        .terms {
            margin-top: 18px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.5;
        }


        @media (max-width: 480px) {

            .signup-card {
                padding: 28px 22px;
            }

            .brand h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="signup-wrapper">


        <div class="signup-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    +
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Create your pharmacy customer account
                </p>

            </div>


            <!-- SIGNUP FORM -->

            <form id="signup-form">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="03001234567"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="signup-btn"
                    id="signup-btn"
                >
                    Create Account
                </button>


                <!-- MESSAGE -->

                <div
                    class="message"
                    id="message"
                ></div>


            </form>


            <!-- LOGIN -->

            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


            <div class="terms">

                By creating an account, you agree to
                our terms and conditions.

            </div>


        </div>


    </div>


    <script>

        const signupForm =
            document.getElementById(
                "signup-form"
            );

        const message =
            document.getElementById(
                "message"
            );

        const signupBtn =
            document.getElementById(
                "signup-btn"
            );


        signupForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;


                // Check password

                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "#dc2626";

                    return;

                }


                // Loading

                signupBtn.disabled = true;

                signupBtn.textContent =
                    "Creating Account...";

                message.textContent =
                    "";


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/customers/signup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name,
                                        email,
                                        phone,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Signup failed"
                        );

                    }


                    message.textContent =
                        "Account created successfully! Redirecting to login...";

                    message.style.color =
                        "#16a34a";


                    /*
                        IMPORTANT:

                        Signup ke baad
                        direct Login page
                    */

                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1200
                    );


                } catch (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    message.textContent =
                        error.message ||
                        "Failed to create account.";

                    message.style.color =
                        "#dc2626";


                    signupBtn.disabled =
                        false;

                    signupBtn.textContent =
                        "Create Account";

                }

            }
        );

    </script>


</body>

</html>
