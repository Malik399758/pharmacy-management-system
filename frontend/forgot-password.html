<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Pharmacy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #ecfeff
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .forgot-wrapper {
            width: 100%;
            max-width: 440px;
        }


        .forgot-card {
            background: #ffffff;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(15, 23, 42, 0.12);
        }


        /* ===============================
           BRAND
        =============================== */

        .brand {
            text-align: center;

            margin-bottom: 30px;
        }


        .brand-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 16px;

            border-radius: 16px;

            background: #1e3a8a;

            color: #ffffff;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 28px;

            font-weight: bold;
        }


        .brand h1 {
            margin: 0;

            color: #0b1f3a;

            font-size: 27px;
        }


        .brand p {
            margin-top: 10px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;
        }


        /* ===============================
           FORM
        =============================== */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        .form-group input {
            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        .form-group input:focus {
            border-color: #1e3a8a;

            box-shadow:
                0 0 0 3px
                rgba(30, 58, 138, 0.10);
        }


        /* ===============================
           BUTTON
        =============================== */

        .reset-btn {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background: #1e3a8a;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .reset-btn:hover {
            background: #172e6d;
        }


        .reset-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }


        /* ===============================
           MESSAGE
        =============================== */

        .message {
            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }


        /* ===============================
           BACK TO LOGIN
        =============================== */

        .back-login {
            margin-top: 24px;

            text-align: center;

            font-size: 14px;

            color: #64748b;
        }


        .back-login a {
            color: #1e3a8a;

            font-weight: 600;

            text-decoration: none;
        }


        .back-login a:hover {
            text-decoration: underline;
        }


        /* ===============================
           SECURITY NOTE
        =============================== */

        .security-note {
            margin-top: 22px;

            padding: 12px;

            border-radius: 10px;

            background: #f8fafc;

            color: #64748b;

            text-align: center;

            font-size: 12px;

            line-height: 1.5;
        }


        /* ===============================
           MOBILE
        =============================== */

        @media (max-width: 480px) {

            .forgot-card {
                padding: 28px 22px;
            }


            .brand h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="forgot-wrapper">


        <div class="forgot-card">


            <!-- ==========================
                 BRAND
            =========================== -->

            <div class="brand">

                <div class="brand-icon">
                    🔒
                </div>


                <h1>
                    Forgot Password?
                </h1>


                <p>
                    Enter your registered email address
                    and we'll help you reset your password.
                </p>

            </div>


            <!-- ==========================
                 FORM
            =========================== -->

            <form id="forgot-password-form">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- ==========================
                     BUTTON
                =========================== -->

                <button
                    type="submit"
                    class="reset-btn"
                    id="reset-btn"
                >
                    Continue
                </button>


                <!-- ==========================
                     MESSAGE
                =========================== -->

                <div
                    class="message"
                    id="message"
                ></div>


            </form>


            <!-- ==========================
                 BACK TO LOGIN
            =========================== -->

            <div class="back-login">

                Remember your password?

                <a href="login.html">
                    Back to Login
                </a>

            </div>


            <!-- ==========================
                 SECURITY NOTE
            =========================== -->

            <div class="security-note">

                🔐 Your account information is protected
                and your password will never be displayed.

            </div>


        </div>


    </div>


    <script>

    const forgotPasswordForm =
        document.getElementById(
            "forgot-password-form"
        );


    const message =
        document.getElementById(
            "message"
        );


    const resetBtn =
        document.getElementById(
            "reset-btn"
        );


    // ===============================
    // FORGOT PASSWORD
    // ===============================

    forgotPasswordForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            if (!email) {

                message.textContent =
                    "Please enter your email address.";

                message.style.color =
                    "#dc2626";

                return;
            }


            // ===============================
            // LOADING
            // ===============================

            resetBtn.disabled = true;

            resetBtn.textContent =
                "Checking...";

            message.textContent = "";


            try {

                // ===============================
                // BACKEND API
                // ===============================

                const response =
                    await fetch(
                        "http://localhost:5000/api/customers/forgot-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    email: email
                                })
                        }
                    );


                const data =
                    await response.json();


                // ===============================
                // ERROR
                // ===============================

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Password reset request failed"
                    );

                }


                // ===============================
                // SUCCESS
                // ===============================

                message.textContent =
                    "Password reset request successful. Check the backend console for the reset token.";

                message.style.color =
                    "#16a34a";


                console.log(
                    "Reset Token:",
                    data.resetToken
                );


            } catch (error) {

                console.error(
                    "Forgot password error:",
                    error
                );


                message.textContent =
                    error.message ||
                    "Something went wrong. Please try again.";

                message.style.color =
                    "#dc2626";

            }


            // ===============================
            // RESET BUTTON
            // ===============================

            resetBtn.disabled = false;

            resetBtn.textContent =
                "Continue";

        }
    );

</script>


</body>

</html>
